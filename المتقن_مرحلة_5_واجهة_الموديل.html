<title>📱 المتقن | دليل أسعار قطع الغيار</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:#0f0f1a;color:#e8e8ee;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1a1a2e,#16213e);padding:12px 14px;border-bottom:1px solid #2a2a4a;box-shadow:0 4px 20px #0008}
.app-title{text-align:center;color:#00d4ff;font-weight:800;font-size:18px;margin-bottom:10px}
.search{position:relative}.search input{width:100%;padding:13px 44px 13px 16px;border:1px solid #303052;border-radius:14px;background:#0c0c16;color:#fff;outline:0}.search input:focus{border-color:#00d4ff;box-shadow:0 0 0 3px #00d4ff22}.search span{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
.stats{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;background:#151526;color:#888;font-size:12px;border-bottom:1px solid #20203a}
.filters{display:flex;gap:6px;padding:9px 14px;overflow:auto;background:#0f0f1a;border-bottom:1px solid #20203a;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #2d2d4d;background:#19192c;color:#aaa;border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700}.chip.active{background:#00d4ff;color:#061018;border-color:#00d4ff}
.list{padding:10px 12px 105px;display:grid;gap:8px}
.card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid #2a2a4a;border-radius:15px;padding:14px;transition:.18s}.card:active{transform:scale(.985)}.card.open{border-color:#00d4ff}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.model{font-weight:800;font-size:16px;color:#fff}.brand{display:inline-block;margin-top:5px;background:#00d4ff18;color:#00d4ff;border-radius:10px;padding:3px 8px;font-size:11px;font-weight:700}
.count{background:#00d4ff18;color:#00d4ff;border-radius:12px;padding:5px 9px;font-size:11px;white-space:nowrap}
.details{display:none;border-top:1px solid #292943;margin-top:12px;padding-top:12px}.open .details{display:block}
.part-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.part{background:#101020;border:1px solid #292943;border-radius:11px;padding:9px;text-align:right}.part strong{display:block;color:#fff;font-size:12px}.part small{color:#888}.prices{margin-top:8px}.price{display:flex;justify-content:space-between;border-top:1px solid #202038;padding:6px 0;font-size:12px}.price b{color:#00ff88;direction:ltr}.muted{color:#777}
.actions{display:flex;gap:6px;margin-top:10px}.btn{border:0;border-radius:10px;padding:8px 11px;font-weight:700;font-size:12px}.primary{background:#00d4ff;color:#061018}.secondary{background:#22223a;color:#bbb;border:1px solid #343452}.danger{background:#ff3f4d22;color:#ff6973;border:1px solid #ff3f4d55}
.bottom{position:fixed;z-index:110;bottom:0;left:0;right:0;padding:10px 14px 20px;background:linear-gradient(180deg,transparent,#0f0f1a 28%);display:flex;gap:8px;justify-content:center;backdrop-filter:blur(8px)}
.bottom .btn{padding:12px 16px}
.empty{text-align:center;padding:60px 20px;color:#666}.empty .ico{font-size:46px;margin-bottom:10px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:200;padding:18px;align-items:center;justify-content:center}.modal.show{display:flex}
.box{position:relative;width:100%;max-width:480px;max-height:88vh;overflow:auto;background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid #303052;border-radius:20px;padding:20px}
.close{position:absolute;left:10px;top:10px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#aaa;font-size:20px}
.title{color:#00d4ff;text-align:center;font-size:18px;font-weight:800;margin-bottom:16px}
label{display:block;color:#aaa;font-size:12px;margin:10px 0 5px}
input,select,textarea{width:100%;background:#0e0e1b;color:#fff;border:1px solid #303052;border-radius:10px;padding:10px;outline:0}textarea{min-height:70px;resize:vertical}
.form-actions{display:flex;gap:8px;margin-top:15px}.form-actions .btn{flex:1}
.toast{position:fixed;z-index:300;top:18px;left:50%;transform:translate(-50%,-100px);background:#00d4ff;color:#061018;padding:11px 18px;border-radius:12px;font-weight:800;transition:.25s;box-shadow:0 5px 20px #00d4ff44}.toast.show{transform:translate(-50%,0)}
.section{background:#101020;border:1px solid #292943;border-radius:12px;padding:10px;margin-top:8px}.section h4{color:#fff;margin-bottom:6px}.source{font-size:10px;color:#666}
.status{font-size:10px;border-radius:9px;padding:4px 7px;border:1px solid #292943}
.status.yes{color:#00ff88;background:#00ff8812}.status.no{color:#777;background:#ffffff05}
.model-hero{background:linear-gradient(135deg,#101020,#1b1b31);border:1px solid #303052;border-radius:16px;padding:14px;margin-bottom:12px}
.model-hero h2{font-size:21px;color:#fff}.model-hero p{color:#00d4ff;font-size:12px;margin-top:5px}
.category-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.category-card{background:#101020;border:1px solid #292943;border-radius:13px;padding:11px;cursor:pointer}
.category-card.available{border-color:#00d4ff55}.category-card .cat-title{font-weight:800;color:#fff;font-size:12px}
.category-card .cat-status{font-size:10px;margin-top:5px;color:#00ff88}.category-card.unavailable .cat-status{color:#777}
.part-list{display:grid;gap:7px;margin-top:9px}
.part-item{background:#101020;border:1px solid #292943;border-radius:11px;padding:10px}
.part-item .top{display:flex;justify-content:space-between;gap:8px}.part-item b{color:#00ff88;direction:ltr}

@media(min-width:700px){.list{grid-template-columns:repeat(2,1fr)}.part-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

ervice Pack","variant":"S936 S25 PLUS NO FRAME","quality":"Service Pack","price":970,"source":"SVC Excel"}],"sources":["10.08.2026 SVC.xlsx"]},{"id":1966,"brand":"SVC","model":"S936 S25 PLUS","aliases":[],"parts":[{"category":"servicePack","name":"Service Pack","variant":"S936 S25 PLUS","quality":"Service Pack","color":"BLACK","price":1170,"source":"SVC Excel"}],"sources":["10.08.2026 SVC.xlsx"]},{"id":1967,"brand":"SVC","model":"S937 S25 EDGE/SLIM","aliases":["SLIM"],"parts":[{"category":"servicePack","name":"Service Pack","variant":"S937 S25 EDGE/SLIM","quality":"Service Pack","color":"BLACK","price":1750,"source":"SVC Excel"}],"sources":["10.08.2026 SVC.xlsx"]},{"id":1968,"brand":"SVC","model":"S938   S25ULTRA NOFREAM","aliases":[],"parts":[{"category":"servicePack","name":"Service Pack","variant":"S938   S25ULTRA NOFREAM","quality":"Service Pack","price":1390,"source":"SVC Excel"}],"sources":["10.08.2026 SVC.xlsx"]},{"id":1969,"brand":"SVC","model":"S938   S25ULTRA +frame","aliases":[],"parts":[{"category":"servicePack","name":"Service Pack","variant":"S938   S25ULTRA +frame","quality":"Service Pack","color":"black","price":1600,"source":"SVC Excel"}],"sources":["10.08.2026 SVC.xlsx"]},{"id":1970,"brand":"SVC","model":"S948 (S26 ULTRA)","aliases":[],"parts":[{"category":"servicePack","name":"Service Pack","variant":"S948 (S26 ULTRA)","quality":"Service Pack","color":"NO FRAME","price":1650,"source":"SVC Excel"}],"sources":["10.08.2026 SVC.xlsx"]},{"id":1971,"brand":"SVC","model":"S948 (S26 ULTRA)/FR","aliases":["FR"],"parts":[{"category":"servicePack","name":"Service Pack","variant":"S948 (S26 ULTRA)/FR","quality":"Service Pack","color":"BLACK","price":2080,"source":"SVC Excel"},{"category":"servicePack","name":"Service Pack","variant":"S948 (S26 ULTRA)/FR","quality":"Service Pack","color":"VIOLET","price":2080,"source":"SVC Excel"}],"sources":["10.08.2026 SVC.xlsx"]}]};
const STORAGE_KEY = "almutqan_unified_db_v1";
const CATEGORY_LABELS = {
 screen:"📱 الشاشة", battery:"🔋 البطارية", camera:"📷 الكاميرا", speaker:"🔊 الجرس/السماعة",
 microphone:"🎙️ المايك", chargingPort:"🔌 منفذ/فلات الشحن", button:"🔘 الأزرار", flex:"🧩 الفلاتات",
 backCover:"🔙 الظهر", antenna:"📡 الهوائي", fingerprint:"🖐️ البصمة", ic:"🔧 IC", other:"📦 أخرى"
};
let db = loadDB(), selectedBrand="الكل", query="", openId=null;

function loadDB(){
  try{const x=localStorage.getItem(STORAGE_KEY);return x?JSON.parse(x):structuredClone(INITIAL_DB)}catch(e){return structuredClone(INITIAL_DB)}
}
function saveDB(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function norm(v){return String(v??"").toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim()}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}
function brandList(){
  const brands=["الكل",...new Set(db.models.map(x=>x.brand).filter(Boolean))];
  document.getElementById("brands").innerHTML=brands.map(b=>`<button class="chip ${b===selectedBrand?"active":""}" onclick="setBrand('${esc(b).replace(/'/g,"\\'")}')">${esc(b)}</button>`).join("");
}
function setBrand(b){selectedBrand=b;render()}
function matches(m){
  if(selectedBrand!=="الكل"&&m.brand!==selectedBrand)return false;
  if(!query)return true;
  const hay=norm([m.brand,m.model,...(m.aliases||[]),...(m.parts||[]).flatMap(p=>[p.name,p.variant,p.quality,p.color,p.notes,p.source])].join(" "));
  return hay.includes(norm(query));
}
function render(){
  brandList();
  const arr=db.models.filter(matches);
  document.getElementById("stats").textContent=`📦 ${arr.length} موديل من أصل ${db.models.length} • ${countParts()} قطعة`;
  document.getElementById("updated").textContent=`🔄 ${db.meta?.generatedAt||"—"}`;
  const list=document.getElementById("list");
  if(!arr.length){list.innerHTML=`<div class="empty"><div class="ico">🔎</div><b>لا توجد نتائج</b><div>جرّب اسم موديل أو كود مختلف</div></div>`;return}
  list.innerHTML=arr.map(card).join("");
}
function countParts(){return db.models.reduce((n,m)=>n+(m.parts?.length||0),0)}
function status(m){
  const cats=new Set((m.parts||[]).map(p=>p.category));
  return Object.keys(CATEGORY_LABELS).filter(k=>cats.has(k)).length;
}
function card(m){
  const parts=m.parts||[];
  const cats=new Set(parts.map(p=>p.category));
  const common=["screen","battery","camera","chargingPort","speaker","flex","button","backCover"];
  const available=common.filter(c=>cats.has(c)).length;
  return `<article class="card" onclick="openModelPage(${m.id})">
    <div class="row">
      <div><div class="model">${esc(m.model)}</div><span class="brand">${esc(m.brand||"—")}</span></div>
      <span class="count">${available}/${common.length} أقسام</span>
    </div>
    <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px">
      ${common.slice(0,5).map(c=>`<span class="status ${cats.has(c)?"yes":"no"}">${CATEGORY_LABELS[c].split(" ")[0]} ${cats.has(c)?"متوفر":"غير مضاف"}</span>`).join("")}
    </div>
    <div class="muted" style="margin-top:9px;font-size:11px">${parts.length?`اضغط لعرض ${parts.length} سعر/قطعة`:"اضغط لإضافة أول قطعة"}</div>
  </article>`
}
function partHTML(p,i){
  const label=CATEGORY_LABELS[p.category]||("📦 "+(p.name||p.category||"قطعة"));
  return `<div class="part"><strong>${esc(label)}</strong>
    <small>${esc(p.variant||"—")} ${p.quality&&p.quality!==p.variant?"• "+esc(p.quality):""}</small>
    ${p.color?`<small> • ${esc(p.color)}</small>`:""}
    <div class="prices"><div class="price"><span>السعر</span><b>${esc(p.price??"غير محدد")}</b></div></div>
    ${p.notes?`<div class="source">${esc(p.notes)}</div>`:""}
    ${p.source?`<div class="source">المصدر: ${esc(p.source)}</div>`:""}
    <div class="actions"><button class="btn secondary" onclick="event.stopPropagation();editPart(${currentModelId()},${i})">✏️</button><button class="btn danger" onclick="event.stopPropagation();deletePart(${currentModelId()},${i})">🗑️</button></div>
  </div>`
}
function currentModelId(){return openId}
function toggle(id){openId=openId===id?null:id;render()}
function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function formPart(p={}){
 return `<label>نوع القطعة</label><select id="fcat">${Object.entries(CATEGORY_LABELS).map(([k,v])=>`<option value="${k}" ${p.category===k?"selected":""}>${v}</option>`).join("")}</select>
 <label>اسم القطعة</label><input id="fname" value="${esc(p.name||"")} " placeholder="مثال: الشاشة">
 <label>النوع / المتغير</label><input id="fvariant" value="${esc(p.variant||"")}" placeholder="OLED / GX / Service Pack...">
 <label>الجودة</label><input id="fquality" value="${esc(p.quality||"")}" placeholder="Original / Copy...">
 <label>اللون</label><input id="fcolor" value="${esc(p.color||"")}" placeholder="Black">
 <label>السعر</label><input id="fprice" value="${esc(p.price??"")}" inputmode="decimal" placeholder="السعر">
 <label>ملاحظات</label><textarea id="fnotes" placeholder="أي ملاحظة إضافية">${esc(p.notes||"")}</textarea>
 <div class="form-actions"><button class="btn primary" id="savePart">💾 حفظ</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`;
}

function openModelPage(id){
 const m=db.models.find(x=>x.id===id); if(!m)return;
 openId=id;
 const cats=Object.keys(CATEGORY_LABELS);
 const parts=m.parts||[];
 const body=`<div class="model-hero">
   <h2>📱 ${esc(m.model)}</h2>
   <p>${esc(m.brand||"")} ${m.aliases?.length?"• "+esc(m.aliases.join(" • ")):""}</p>
   <div class="actions">
    <button class="btn primary" onclick="addPart(${id})">➕ إضافة قطعة</button>
    <button class="btn secondary" onclick="editModel(${id})">✏️ تعديل</button>
   </div>
  </div>
  <div class="category-list">
   ${cats.map(c=>{
     const ps=parts.filter(p=>p.category===c);
     return `<div class="category-card ${ps.length?"available":"unavailable"}" onclick="showCategory(${id},'${c}')">
       <div class="cat-title">${CATEGORY_LABELS[c]}</div>
       <div class="cat-status">${ps.length?`✅ ${ps.length} سعر/قطعة`:"○ غير مضاف"}</div>
     </div>`;
   }).join("")}
  </div>`;
 openModal("تفاصيل الموديل",body);
}
function showCategory(id,cat){
 const m=db.models.find(x=>x.id===id);if(!m)return;
 const ps=(m.parts||[]).filter(p=>p.category===cat);
 const title=CATEGORY_LABELS[cat]||cat;
 const body=`<div class="model-hero"><h2>${esc(m.model)}</h2><p>${title}</p></div>
 ${ps.length?`<div class="part-list">${ps.map((p,i)=>`<div class="part-item">
   <div class="top"><span>${esc(p.variant||p.quality||"نوع غير محدد")}</span><b>${esc(p.price??"غير محدد")}</b></div>
   <div class="muted" style="margin-top:5px;font-size:11px">
    ${p.quality?`الجودة: ${esc(p.quality)} • `:""}${p.color?`اللون: ${esc(p.color)}`:""}
   </div>
   ${p.notes?`<div class="source" style="margin-top:5px">${esc(p.notes)}</div>`:""}
   <div class="actions">
    <button class="btn secondary" onclick="editPart(${id},${m.parts.indexOf(p)})">✏️ تعديل</button>
    <button class="btn danger" onclick="deletePart(${id},${m.parts.indexOf(p)})">🗑️ حذف</button>
   </div>
  </div>`).join("")}</div>`:
  `<div class="empty" style="padding:25px 5px"><div>📭</div><div class="muted">هذه القطعة غير مضافة لهذا الموديل.</div></div>`}
  <div class="form-actions"><button class="btn primary" onclick="addPart(${id})">➕ إضافة قطعة</button><button class="btn secondary" onclick="openModelPage(${id})">↩️ رجوع للموديل</button></div>`;
 openModal(title,body);
}
function addPart(id){
 const m=db.models.find(x=>x.id===id);if(!m)return;
 openModal("➕ إضافة قطعة إلى "+m.model,formPart());
 document.getElementById("savePart").onclick=()=>{
  const p=readPart();m.parts=m.parts||[];m.parts.push(p);saveDB();closeModal();render();openModelPage(id);toast("تمت إضافة القطعة ✅")
 }
}
function editPart(id,i){
 const m=db.models.find(x=>x.id===id),p=m?.parts?.[i];if(!p)return;
 openModal("✏️ تعديل القطعة",formPart(p));
 document.getElementById("savePart").onclick=()=>{
  m.parts[i]=readPart(p);saveDB();closeModal();render();openModelPage(id);toast("تم تعديل القطعة ✅")
 }
}
function readPart(old={}){
 const price=document.getElementById("fprice").value.trim();
 return {category:document.getElementById("fcat").value,name:document.getElementById("fname").value.trim()||CATEGORY_LABELS[document.getElementById("fcat").value],variant:document.getElementById("fvariant").value.trim(),quality:document.getElementById("fquality").value.trim(),color:document.getElementById("fcolor").value.trim(),price:price===""?null:(isNaN(Number(price))?price:Number(price)),notes:document.getElementById("fnotes").value.trim(),source:old.source||"إضافة يدوية"}
}
function openAddModel(){
 openModal("➕ إضافة موديل",`<label>العلامة التجارية</label><input id="mbrand" placeholder="Samsung">
 <label>الموديل</label><input id="mmodel" placeholder="A15">
 <label>أكواد/أسماء بديلة</label><input id="malias" placeholder="A155F, SM-A155F">
 <div class="form-actions"><button class="btn primary" id="saveModel">💾 إنشاء</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`);
 document.getElementById("saveModel").onclick=()=>{
  const brand=document.getElementById("mbrand").value.trim(),model=document.getElementById("mmodel").value.trim();
  if(!brand||!model)return toast("أدخل العلامة والموديل");
  const id=Math.max(1000,...db.models.map(x=>Number(x.id)||0))+1;
  db.models.push({id,brand,model,aliases:document.getElementById("malias").value.split(",").map(x=>x.trim()).filter(Boolean),parts:[],sources:["إضافة يدوية"]});
  saveDB();closeModal();selectedBrand="الكل";query="";document.getElementById("search").value="";openId=id;render();toast("تم إنشاء الموديل ✅")
 }
}
function editModel(id){
 const m=db.models.find(x=>x.id===id);if(!m)return;
 openModal("✏️ تعديل الموديل",`<label>العلامة التجارية</label><input id="mbrand" value="${esc(m.brand)}">
 <label>الموديل</label><input id="mmodel" value="${esc(m.model)}">
 <label>أسماء/أكواد بديلة</label><input id="malias" value="${esc((m.aliases||[]).join(", "))}">
 <div class="form-actions"><button class="btn primary" id="saveModel">💾 حفظ</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`);
 document.getElementById("saveModel").onclick=()=>{
  m.brand=document.getElementById("mbrand").value.trim();m.model=document.getElementById("mmodel").value.trim();
  m.aliases=document.getElementById("malias").value.split(",").map(x=>x.trim()).filter(Boolean);
  saveDB();closeModal();render();toast("تم حفظ التعديل ✅")
 }
}
function deleteModel(id){
 const m=db.models.find(x=>x.id===id);if(!m)return;
 if(confirm(`حذف ${m.brand} ${m.model} وجميع قطعه؟`)){db.models=db.models.filter(x=>x.id!==id);saveDB();openId=null;render();toast("تم الحذف")}
}
function deletePart(id,i){
 const m=db.models.find(x=>x.id===id);if(!m)return;
 if(confirm("حذف هذه القطعة؟")){m.parts.splice(i,1);saveDB();render();openModelPage(id);toast("تم حذف القطعة")}
}
function exportDB(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="almutqan-models.json";a.click();URL.revokeObjectURL(a.href);toast("تم تصدير قاعدة البيانات 💾")
}
function openManage(){
 openModal("⚙️ إدارة قاعدة البيانات",`<div class="section"><h4>📊 الإحصائيات</h4><div>الموديلات: <b>${db.models.length}</b></div><div>القطع/الأسعار: <b>${countParts()}</b></div></div>
 <div class="section"><h4>📥 استيراد JSON</h4><input type="file" id="jsonFile" accept=".json"><button class="btn primary" style="width:100%;margin-top:8px" onclick="importJSON()">استيراد قاعدة</button></div>
 <div class="section"><h4>♻️ إعادة القاعدة الأصلية</h4><button class="btn danger" style="width:100%" onclick="resetDB()">إرجاع بيانات Excel الأصلية</button></div>`);
}
function importJSON(){
 const f=document.getElementById("jsonFile").files[0];if(!f)return toast("اختر ملف JSON");
 const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.models)throw 0;db=x;saveDB();closeModal();render();toast("تم الاستيراد ✅")}catch(e){toast("ملف JSON غير صالح")}};r.readAsText(f)
}
function resetDB(){
 if(confirm("سيتم حذف تعديلاتك وإرجاع بيانات Excel الأصلية. متابعة؟")){db=structuredClone(INITIAL_DB);saveDB();closeModal();openId=null;selectedBrand="الكل";render();toast("تمت استعادة القاعدة الأصلية")}
}
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;render()});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
render();
</script>
</body>
</html>
